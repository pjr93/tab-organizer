<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Reflection Board</title>
    <link rel="icon" href="icon32.png">
    <link rel="stylesheet" href="main.css">
</head>

<body>
<div class="button-container">
    <button id="internal-save-btn" class="state-btn" title="Ctrl+S">Save (Internal)</button>
    <button id="internal-load-btn" class="state-btn">Load (Internal)</button>
    <button id="download-btn" class="state-btn">Save JSON</button>
    <button id="upload-btn" class="state-btn">Upload JSON</button>
    <button id="add-btn" class="state-btn">Add JSON</button>
    <input type="file" id="upload-file-input" accept=".json" />
    <input type="file" id="add-file-input" accept=".json" />
</div>
<div class="checkbox-container">
    <input type="checkbox" id="active-tab-history" name="active-tab-history-state" class="checkbox">
    <label for="active-tab-history">view history in app</label>
    <input type="checkbox" id="autosave" name="autosave-state" class="checkbox">
    <label for="autosave" title="Saves your session about 10 seconds after tabs change. Restore it with Load (Internal).">autosave</label>
    <input type="checkbox" id="full-preview" name="full-preview-state" class="checkbox">
    <label for="full-preview" title="Hovering a tab shows a 300×300 screenshot. Tabs without one are loaded muted in a small window and captured.">full preview</label>
</div>
    <h2>Reflection Board</h2>


    <div id="parent-grid"></div>
    <div id="outside-overlay"></div>
    <div id="drop-indicator">Drop here to create a new group</div>

    <dialog id="save-dialog">
        <form id="save-form">
            <h3 id="save-dialog-title">Save session internally</h3>
            <p id="save-summary" class="load-slot-meta"></p>
            <label class="field">Name
                <input id="save-name" type="text" autocomplete="off" required>
            </label>
            <label class="field">Folder
                <select id="save-folder"></select>
            </label>
            <p class="load-slot-meta">Create folders from Load (Internal).</p>
            <div class="load-dialog-actions">
                <button type="button" id="save-dialog-cancel" class="state-btn">Cancel</button>
                <button type="submit" class="state-btn primary-btn">Save</button>
            </div>
        </form>
    </dialog>

    <dialog id="load-dialog">
        <h3>Internal saves</h3>
        <div class="saves-toolbar">
            <input id="saves-search" type="search" placeholder="Search saves, tab titles and URLs…" autocomplete="off">
            <button type="button" id="new-folder-btn" class="state-btn">New folder</button>
        </div>
        <div id="saves-path"></div>
        <p class="load-dialog-warning">Load replaces all open tabs (except this board). Add opens the save alongside them.</p>
        <div id="saves-list"></div>
        <div class="load-dialog-actions">
            <button type="button" id="load-dialog-cancel" class="state-btn">Close</button>
        </div>
    </dialog>

    <script src="shared.js"></script>
    <script src="main.js"></script>
    <script src="saves.js"></script>
    <script src="switcher-overlay.js"></script>
</body>

</html>
