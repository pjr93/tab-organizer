<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Reflection Board</title>
    <link rel="icon" href="icon32.png">
    <link rel="stylesheet" href="main.css">
</head>

<body>
<div class="button-container">
    <button id="internal-save-btn" class="state-btn" data-hint="Save every window as an internal save (Ctrl+S)">Save (Internal)</button>
    <button id="internal-load-btn" class="state-btn" data-hint="Browse internal saves to load or add one">Load (Internal)</button>
    <button id="download-btn" class="state-btn" data-hint="Download every window as a JSON file">Save JSON</button>
    <button id="upload-btn" class="state-btn" data-hint="Replace the open tabs (except this board) with a JSON file">Upload JSON</button>
    <button id="add-btn" class="state-btn" data-hint="Open a JSON file's windows alongside the current ones">Add JSON</button>
    <input type="file" id="upload-file-input" accept=".json" />
    <input type="file" id="add-file-input" accept=".json" />
    <!-- Options dropdown. -->
    <div class="settings">
        <button type="button" id="settings-btn" class="state-btn" aria-expanded="false" aria-controls="settings-panel"
            data-hint="Options">Settings</button>
        <div id="settings-panel" hidden>
            <label class="settings-option" data-hint="Tab history hotkeys switch the tab in its window but keep you on the board">
                <input type="checkbox" id="active-tab-history"> view history in app
            </label>
            <label class="settings-option" data-hint="Saves your session about 10 seconds after tabs change. Restore it with Load (Internal).">
                <input type="checkbox" id="autosave"> autosave
            </label>
            <label class="settings-option" data-hint="Hovering a tab shows its title and address">
                <input type="checkbox" id="tab-tooltip"> preview text &amp; link
            </label>
            <label class="settings-option" data-hint="Hovering a tab shows a screenshot of it. Tabs without one are loaded muted in a small window and captured.">
                <input type="checkbox" id="full-preview"> preview screenshot
            </label>
            <label class="settings-option" data-hint="Show what things do in the line next to the title">
                <input type="checkbox" id="hints-enabled"> hints
            </label>
            <label class="settings-option" data-hint="How long a hint stays up, in seconds. 0 keeps it up until the next one.">
                hint seconds <input type="number" id="hint-seconds" min="0" step="0.5">
            </label>
        </div>
    </div>
</div>
    <!-- Title with the hover-hint line (hints.js) to its right. -->
    <div class="board-header">
        <h2>Reflection Board</h2>
        <span id="hint-line" aria-live="polite"></span>
    </div>


    <div id="parent-grid"></div>
    <div id="outside-overlay"></div>
    <div id="drop-indicator">Drop here to create a new group</div>

    <dialog id="save-dialog">
        <form id="save-form">
            <h3 id="save-dialog-title">Save session internally</h3>
            <p id="save-summary" class="load-slot-meta"></p>
            <div class="saves-toolbar">
                <input id="pick-search" type="search" placeholder="Search saves, tab titles and URLs…" autocomplete="off">
                <button type="button" id="save-new-folder-btn" class="state-btn">New folder</button>
            </div>
            <div id="pick-path"></div>
            <div id="pick-list"></div>
            <label class="field name-field">Name
                <input id="save-name" type="text" autocomplete="off">
            </label>
            <p id="save-location" class="load-slot-meta"></p>
            <div class="load-dialog-actions">
                <button type="button" id="save-dialog-cancel" class="state-btn">Cancel</button>
                <button type="submit" id="save-submit" class="state-btn primary-btn">Save</button>
            </div>
        </form>
    </dialog>

    <dialog id="load-dialog">
        <h3>Internal saves</h3>
        <div class="saves-toolbar">
            <input id="saves-search" type="search" placeholder="Search saves, tab titles and URLs…" autocomplete="off">
            <button type="button" id="new-folder-btn" class="state-btn">New folder</button>
        </div>
        <div id="saves-path"></div>
        <p class="load-dialog-warning">Load replaces all open tabs (except this board). Add opens the save alongside them.</p>
        <div id="saves-list"></div>
        <div class="load-dialog-actions">
            <button type="button" id="load-dialog-cancel" class="state-btn">Close</button>
        </div>
    </dialog>

    <script src="shared.js"></script>
    <script src="main.js"></script>
    <script src="saves.js"></script>
    <script src="hints.js"></script>
    <script src="switcher-overlay.js"></script>
</body>

</html>
