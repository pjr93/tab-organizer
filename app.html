<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Reflection Board</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
<div class="button-container">
    <button id="internal-save-btn" class="state-btn" title="Ctrl+S">Save (Internal)</button>
    <button id="internal-load-btn" class="state-btn">Load (Internal)</button>
    <button id="download-btn" class="state-btn">Save JSON</button>
    <button id="upload-btn" class="state-btn">Upload JSON</button>
    <button id="add-btn" class="state-btn">Add JSON</button>
    <input type="file" id="upload-file-input" accept=".json" />
    <input type="file" id="add-file-input" accept=".json" />
</div>
<div class="checkbox-container">
    <input type="checkbox" id="active-tab-history" name="active-tab-history-state" class="checkbox">
    <label for="active-tab-history">view history in app</label>
    <input type="checkbox" id="autosave" name="autosave-state" class="checkbox">
    <label for="autosave" title="Saves your session about 10 seconds after tabs change. Restore it with Load (Internal).">autosave</label>
</div>
    <h2>Reflection Board</h2>


    <div id="parent-grid"></div>
    <div id="outside-overlay"></div>
    <div id="drop-indicator">Drop here to create a new group</div>

    <dialog id="load-dialog">
        <h3>Load internal save</h3>
        <p class="load-dialog-warning">Loading replaces all open tabs (except this board).</p>
        <div id="load-dialog-list"></div>
        <div class="load-dialog-actions">
            <button id="load-dialog-cancel" class="state-btn">Cancel</button>
        </div>
    </dialog>

    <script src="shared.js"></script>
    <script src="main.js"></script>
</body>

</html>
